name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel package data
        run: >-
          python -c "from pathlib import Path; from zipfile import ZipFile; wheels = list(Path('dist').glob('*.whl')); assert len(wheels) == 1, wheels; archive = ZipFile(wheels[0]); names = set(archive.namelist()); expected = {'tracecoder/py.typed', 'tracecoder/web_static/index.html', 'tracecoder/web_static/markdown.js', 'tracecoder/web_static/app.js', 'tracecoder/web_static/styles.css'}; missing = expected - names; assert not missing, f'Missing wheel assets: {sorted(missing)}'"

      - name: Check Web JavaScript
        run: |
          node --check src/tracecoder/web_static/markdown.js
          node --check src/tracecoder/web_static/app.js
          node tests/markdown_smoke.cjs
          node tests/web_ui_smoke.cjs

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy
